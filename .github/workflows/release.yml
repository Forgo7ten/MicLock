name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "标记为预发布版本"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read release version from Info.plist
        id: version
        env:
          SELECTED_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./Scripts/release/read-version.sh

  build:
    name: Build ${{ matrix.architecture }} release
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15

          - architecture: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Xcode toolchain
        run: |
          set -euo pipefail

          toolchain="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain"

          test -x "${toolchain}/usr/bin/swiftc"

          echo "MICLOCK_TOOLCHAIN=${toolchain}" >> "${GITHUB_ENV}"

      - name: Run tests
        run: |
          set -euo pipefail
          make test

      - name: Build app
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail

          MICLOCK_ARCH="${TARGET_ARCH}" make build

          binary="build/MicLock.app/Contents/MacOS/MicLock"

          architectures="$(lipo -archs "${binary}")"

          if [[ "${architectures}" != "${TARGET_ARCH}" ]]; then
            echo "error: Expected architecture ${TARGET_ARCH}, got ${architectures}" >&2
            exit 1
          fi

          codesign \
            --verify \
            --deep \
            --strict \
            build/MicLock.app

      - name: Package release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET_ARCH: ${{ matrix.architecture }}
        run: ./Scripts/release/package.sh

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.prepare.outputs.release_tag }}-${{ matrix.architecture }}
          path: |
            dist/MicLock-${{ needs.prepare.outputs.release_tag }}-${{ matrix.architecture }}.zip
            dist/MicLock-${{ needs.prepare.outputs.release_tag }}-${{ matrix.architecture }}.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download arm64 release assets
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.prepare.outputs.release_tag }}-arm64
          path: dist

      - name: Download x86_64 release assets
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.prepare.outputs.release_tag }}-x86_64
          path: dist

      - name: Verify release assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: ./Scripts/release/verify-assets.sh

      - name: Reconcile release tag with current commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: ./Scripts/release/reconcile-tag.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          arm_archive="dist/MicLock-${RELEASE_TAG}-arm64.zip"
          intel_archive="dist/MicLock-${RELEASE_TAG}-x86_64.zip"

          args=(
            release create "${RELEASE_TAG}"

            "${arm_archive}"
            "${arm_archive}.sha256"

            "${intel_archive}"
            "${intel_archive}.sha256"

            --target "${GITHUB_SHA}"
            --title "MicLock ${RELEASE_TAG}"
            --generate-notes
          )

          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"

  sync-homebrew-tap:
    name: Trigger Homebrew tap sync
    needs:
      - prepare
      - publish
    if: ${{ inputs.prerelease == false }}

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Dispatch stable release to homebrew-tap
        id: dispatch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "error: HOMEBREW_TAP_TOKEN is not configured" >&2
            exit 1
          fi

          jq -n \
            --arg tag "${RELEASE_TAG}" \
            '{
              event_type: "miclock-release",
              client_payload: {
                tag: $tag
              }
            }' \
          | gh api \
              --method POST \
              repos/Forgo7ten/homebrew-tap/dispatches \
              --input -

      - name: Report tap sync dispatch failure
        if: ${{ steps.dispatch.outcome == 'failure' }}
        run: |
          echo "::warning::MicLock Release 已发布，但自动触发 homebrew-tap 失败。请手动运行 homebrew-tap 的 Update MicLock Cask workflow。"
          echo "Homebrew Tap 自动同步失败；Release 本身保持成功。" >> "${GITHUB_STEP_SUMMARY}"
