<svg
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- ============================== -->
    <!-- 背景渐变 -->
    <!-- ============================== -->
    <linearGradient
      id="bgGradient"
      x1="120"
      y1="80"
      x2="900"
      y2="950"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#8ED0FF"/>
      <stop offset="0.38" stop-color="#6C93FF"/>
      <stop offset="0.72" stop-color="#6C6AF7"/>
      <stop offset="1" stop-color="#5A54E7"/>
    </linearGradient>

    <radialGradient
      id="bgGlowA"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(250 220) rotate(90) scale(300)"
    >
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient
      id="bgGlowB"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(810 800) rotate(90) scale(320)"
    >
      <stop offset="0" stop-color="#2F2EBE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2F2EBE" stop-opacity="0"/>
    </radialGradient>

    <!-- ============================== -->
    <!-- 麦克风本体 -->
    <!-- ============================== -->
    <linearGradient
      id="micGradient"
      x1="410"
      y1="235"
      x2="620"
      y2="625"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F9FBFF"/>
      <stop offset="1" stop-color="#DCE7FF"/>
    </linearGradient>

    <linearGradient
      id="standGradient"
      x1="320"
      y1="500"
      x2="700"
      y2="800"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE8FF"/>
    </linearGradient>

    <!-- ============================== -->
    <!-- 锁徽章 -->
    <!-- ============================== -->
    <linearGradient id="lockGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF19A"/>
      <stop offset="1" stop-color="#FFBB4C"/>
    </linearGradient>

    <!-- ============================== -->
    <!-- 阴影 -->
    <!-- ============================== -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow
        dx="0"
        dy="22"
        stdDeviation="24"
        flood-color="#173079"
        flood-opacity="0.28"
      />
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="12"
        flood-color="#233A96"
        flood-opacity="0.22"
      />
    </filter>

    <!-- ============================== -->
    <!-- 圆角裁剪 -->
    <!-- 确保四角区域完全透明 -->
    <!-- ============================== -->
    <clipPath id="iconClip">
      <rect width="1024" height="1024" rx="229"/>
    </clipPath>
  </defs>

  <!-- 所有内容裁剪在 App Icon 圆角区域内 -->
  <g clip-path="url(#iconClip)">

    <!-- ============================== -->
    <!-- 背景 -->
    <!-- ============================== -->
    <rect
      width="1024"
      height="1024"
      rx="229"
      fill="url(#bgGradient)"
    />

    <circle
      cx="250"
      cy="220"
      r="300"
      fill="url(#bgGlowA)"
    />

    <circle
      cx="810"
      cy="800"
      r="320"
      fill="url(#bgGlowB)"
    />

    <!-- ============================== -->
    <!-- 装饰：星星 / 爱心 / 气泡 -->
    <!-- ============================== -->

    <!-- 左上星星 -->
    <path
      d="
        M 242 201
        C 247 229 257 239 286 244
        C 257 249 247 259 242 287
        C 237 259 227 249 198 244
        C 227 239 237 229 242 201
        Z
      "
      fill="#FFFFFF"
      opacity="0.92"
    />

    <!-- 右上小星 -->
    <path
      d="
        M 765 172
        C 769 193 777 201 798 205
        C 777 209 769 217 765 238
        C 761 217 753 209 732 205
        C 753 201 761 193 765 172
        Z
      "
      fill="#E6F0FF"
      opacity="0.92"
    />

    <!-- 右中小闪光 -->
    <path
      d="
        M 708 274
        C 711 292 718 299 736 302
        C 718 305 711 312 708 330
        C 705 312 698 305 680 302
        C 698 299 705 292 708 274
        Z
      "
      fill="#FFFFFF"
      opacity="0.82"
    />

    <!-- 左下小爱心 -->
    <path
      d="
        M 220 700
        C 220 678 248 670 260 690
        C 272 670 300 678 300 700
        C 300 725 278 740 260 756
        C 242 740 220 725 220 700
        Z
      "
      fill="#FFD4E7"
      opacity="0.92"
    />

    <!-- 右下小爱心 -->
    <path
      d="
        M 815 675
        C 815 659 834 652 844 666
        C 854 652 873 659 873 675
        C 873 694 858 706 844 718
        C 830 706 815 694 815 675
        Z
      "
      fill="#FFE0F0"
      opacity="0.88"
    />

    <!-- 左侧气泡 -->
    <circle
      cx="196"
      cy="402"
      r="18"
      fill="#FFFFFF"
      opacity="0.28"
    />

    <circle
      cx="231"
      cy="365"
      r="9"
      fill="#FFFFFF"
      opacity="0.42"
    />

    <circle
      cx="180"
      cy="760"
      r="12"
      fill="#FFFFFF"
      opacity="0.26"
    />

    <!-- 右侧气泡 -->
    <circle
      cx="827"
      cy="425"
      r="23"
      fill="#FFFFFF"
      opacity="0.20"
    />

    <circle
      cx="856"
      cy="383"
      r="11"
      fill="#FFFFFF"
      opacity="0.35"
    />

    <circle
      cx="848"
      cy="724"
      r="14"
      fill="#FFFFFF"
      opacity="0.22"
    />

    <!-- ============================== -->
    <!-- 麦克风主体 -->
    <!-- ============================== -->
    <g filter="url(#shadow)">

      <!-- 麦克风身体 -->
      <rect
        x="389"
        y="205"
        width="246"
        height="410"
        rx="123"
