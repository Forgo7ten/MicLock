        opacity="0.92"
      />

      <!-- 可爱眉眼 -->
      <path
        d="M 431 355 Q 448 344 467 352"
        fill="none"
        stroke="#293C94"
        stroke-width="8"
        stroke-linecap="round"
      />

      <path
        d="M 557 352 Q 576 344 593 355"
