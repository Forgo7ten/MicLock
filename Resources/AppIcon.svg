        ry="10"
        fill="#8AD8FF"
      />

      <circle
        cx="478"
        cy="386"
        r="5"
        fill="#FFFFFF"
        opacity="0.92"
      />

      <!-- 右眼 -->
      <ellipse
        cx="564"
        cy="402"
        rx="34"
        ry="44"
        fill="#263985"
      />

      <ellipse
        cx="555"
        cy="387"
        rx="13"
        ry="16"
        fill="#FFFFFF"
      />

      <ellipse
        cx="574"
        cy="415"
