      <!-- ========================== -->
      <!-- 张嘴笑 -->
      <!-- 恢复最初版本，不吐舌头 -->
      <!-- ========================== -->

      <!-- 嘴巴主体 -->
      <path
        d="
          M 480 465
          Q 512 500 544 465
          Q 535 516 512 519
          Q 489 516 480 465
          Z
        "
        fill="#33428D"
      />

      <!-- 嘴巴内部粉色 -->
      <path
        d="
          M 493 495
          Q 512 482 531 495
          Q 523 512 512 513
          Q 501 512 493 495
          Z
        "
        fill="#FF88AD"
      />

      <!-- ========================== -->
      <!-- U 型支架 -->
      <!-- ========================== -->

      <path
        d="
          M 323 464
          L 323 530
          C 323 675 407 731 512 731
          C 617 731 701 675 701 530
          L 701 464
        "
        fill="none"
        stroke="#293C94"
        stroke-width="82"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="
          M 323 464
          L 323 530
          C 323 675 407 731 512 731
          C 617 731 701 675 701 530
          L 701 464
        "
        fill="none"
        stroke="url(#standGradient)"
        stroke-width="52"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- 立杆外描边 -->
      <line
        x1="512"
        y1="724"
        x2="512"
        y2="805"
        stroke="#293C94"
        stroke-width="74"
        stroke-linecap="round"
      />

      <!-- 立杆 -->
      <line
        x1="512"
        y1="724"
        x2="512"
        y2="805"
        stroke="#EDF3FF"
        stroke-width="46"
        stroke-linecap="round"
      />

      <!-- 底座外描边 -->
      <line
        x1="390"
        y1="817"
        x2="634"
        y2="817"
        stroke="#293C94"
        stroke-width="78"
        stroke-linecap="round"
      />

      <!-- 底座 -->
      <line
        x1="390"
        y1="817"
        x2="634"
        y2="817"
        stroke="#F5F8FF"
        stroke-width="48"
        stroke-linecap="round"
      />
    </g>

    <!-- ============================== -->
    <!-- MicLock 锁徽章 -->
    <!-- ============================== -->

    <g
      transform="translate(636 575) rotate(9)"
      filter="url(#softShadow)"
    >
      <!-- 锁梁外描边 -->
      <path
        d="
          M 34 70
          V 43
          C 34 0 104 0 104 43
          V 70
        "
        fill="none"
        stroke="#293C94"
        stroke-width="29"
        stroke-linecap="round"
      />

      <!-- 锁梁 -->
      <path
        d="
          M 34 70
          V 43
          C 34 0 104 0 104 43
          V 70
        "
        fill="none"
        stroke="#FFE789"
        stroke-width="17"
        stroke-linecap="round"
      />

      <!-- 锁体 -->
      <rect
        x="0"
        y="59"
        width="138"
        height="118"
        rx="35"
        fill="url(#lockGradient)"
        stroke="#293C94"
        stroke-width="14"
      />

      <!-- 锁体高光 -->
      <path
        d="
          M 24 88
          Q 39 75 57 76
        "
        fill="none"
        stroke="#FFF7C4"
        stroke-width="11"
        stroke-linecap="round"
