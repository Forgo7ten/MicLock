      />

      <!-- 锁孔 -->
      <circle
        cx="69"
        cy="111"
        r="14"
        fill="#36428A"
      />

      <path
        d="
          M 61 119
          L 57 146
          H 81
          L 77 119
          Z
        "
        fill="#36428A"
      />

      <!-- 锁体小爱心 -->
      <path
        d="
          M 102 98
          C 102 90 111 87 116 93
          C 121 87 130 90 130 98
          C 130 107 123 113 116 119
          C 109 113 102 107 102 98
          Z
        "
        fill="#FFF4BF"
        opacity="0.95"
      />
    </g>

    <!-- ============================== -->
    <!-- 顶部开心装饰 -->
    <!-- ============================== -->

    <path
      d="M 373 202 Q 345 179 325 157"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="18"
      stroke-linecap="round"
      opacity="0.94"
    />

    <path
      d="M 651 202 Q 679 179 699 157"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="18"
      stroke-linecap="round"
      opacity="0.94"
    />

    <!-- 顶部小爱心 -->
    <path
      d="
        M 497 126
        C 497 109 517 102 528 116
        C 539 102 559 109 559 126
        C 559 147 542 160 528 172
        C 514 160 497 147 497 126
        Z
      "
      fill="#FFFFFF"
      opacity="0.92"
    />

    <!-- 顶部小气泡 -->
    <circle
      cx="335"
      cy="176"
      r="9"
      fill="#FFFFFF"
      opacity="0.46"
    />

    <circle
      cx="690"
      cy="176"
      r="9"
      fill="#FFFFFF"
      opacity="0.46"
    />

  </g>
</svg>