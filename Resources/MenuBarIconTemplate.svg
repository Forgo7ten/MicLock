<svg
  width="22"
  height="22"
  viewBox="0 0 22 22"
  xmlns="http://www.w3.org/2000/svg"
>
  <!--
    MicLock macOS Menu Bar Template Icon

    - Transparent background
    - Monochrome black
    - Designed for macOS Template Image
    - Recommended display size: 17–18 pt
  -->

  <!-- Microphone body -->
  <rect
    x="5"
    y="2"
    width="7"
    height="10.2"
    rx="3.5"
    fill="none"
    stroke="#000"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Smile -->
  <path
    d="M 6.9 7.6 Q 8.5 9 10.1 7.6"
    fill="none"
    stroke="#000"
    stroke-width="1.2"
    stroke-linecap="round"
  />

  <!-- Microphone stand -->
  <path
    d="
      M 3.3 9.4
      V 10.6
      C 3.3 14 5.4 15.8 8.5 15.8
      C 11.6 15.8 13.7 14 13.7 10.6
      V 9.4
    "
    fill="none"
    stroke="#000"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Stand stem -->
  <path
    d="M 8.5 15.8 V 19"
    fill="none"
    stroke="#000"
    stroke-width="1.5"
    stroke-linecap="round"
  />

  <!-- Stand base -->
  <path
    d="M 6.2 19 H 10.8"
    fill="none"
    stroke="#000"
    stroke-width="1.5"
    stroke-linecap="round"
  />

  <!-- Lock shackle -->
  <path
    d="
      M 15.1 14.9
      V 13.8
      C 15.1 12 18 12 18 13.8
      V 14.9
    "
    fill="none"
    stroke="#000"
    stroke-width="1.4"
    stroke-linecap="round"
  />

  <!-- Lock body -->
  <rect
    x="14"
    y="14.7"
    width="5.1"
    height="4.2"
    rx="1"
    fill="#000"
  />
</svg>